<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfilamiento Emprendedor Diverso</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 fallback */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .bg-gradient-pride {
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%); /* Soft warm gradient */
        }
        
        .bg-gradient-vibrant {
             background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* Custom Scrollbar for better UX */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-100">

<div id="root" class="w-full h-full sm:h-auto sm:max-w-md w-full sm:w-auto bg-white sm:rounded-2xl sm:shadow-xl overflow-hidden relative"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Configuration ---
    const SHEETDB_URL = 'https://script.google.com/macros/s/AKfycbwwCIHNVCQlF7UV1K0_ofwV5j30TF15zrlUvItRtXD3Rb-IEfATEi7xZLhKp7Bz0eLIKQ/exec
    const ALLOWED_USERS = ["123456", "987654", "000000"]; // Simple local validation

    // --- Components ---

    // Icons using Lucide (standalone version requires DOM rendering, simpler to use SVGs inline for React standalone)
    const IconUser = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const IconLock = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-lock"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
    const IconChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>;
    const IconChevronLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>;
    const IconCheckCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-check-circle text-green-500 mb-4"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>;
    const IconLoader = () => <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-loader-2 animate-spin text-purple-600 mb-4"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>;
    const IconHeartHandshake = () => <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-heart-handshake text-pink-500 mb-4"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08v0c.82.82 2.13.85 3 .07l2.07-1.9a2.82 2.82 0 0 1 3.79 0l2.96 2.66"/><path d="m18 15-2-2"/><path d="m15 18-2-2"/></svg>;


    // --- Quiz Data Structure ---
    const quizModules = [
        {
            title: "Módulo 1: Datos Personales",
            questions: [
                { id: "nombre_preferido", type: "text", text: "¡Hola! Qué emoción tenerte aquí. Para empezar, ¿cómo prefieres que te llamemos?" },
                { id: "nombre_legal", type: "text", text: "Para los registros oficiales del programa, ¿cuál es el nombre y apellido que aparece en tu documento de identidad?" },
                { id: "edad", type: "number", text: "¿Cuántos años tienes?" },
                { id: "genero", type: "select", text: "¿Con qué género te identificas?", options: ["Mujer", "Hombre", "No binario", "Otro", "Prefiero no decirlo"] },
                { id: "estado_civil", type: "select", text: "Cuéntanos un poco más sobre ti, ¿cuál es tu estado civil?", options: ["Soltería", "Matrimonio", "Unión Libre", "Otro"] },
                { id: "educacion", type: "select", text: "¿Hasta qué nivel estudiaste?", options: ["Primaria", "Bachillerato", "Nivel Técnico/Tecnológico", "Nivel Universitario"] }
            ]
        },
        {
            title: "Módulo 2: Estado Financiero",
            questions: [
                { id: "trabajo_extra", type: "select", text: "Aparte de tu emprendimiento, ¿tienes algún otro trabajo actualmente?", options: ["Sí, también tengo un empleo", "No, me dedico 100% a mi emprendimiento"] },
                { id: "salud_pension", type: "select", text: "¿Estás cotizando a salud y pensión en este momento?", options: ["Sí", "No"] },
                { id: "dinero_libre", type: "number", text: "En un mes normal, ¿cuánto dinero de ganancia (lo que te queda 'libre') genera tu negocio?", prefix: "$" },
                { id: "gastos_negocio", type: "number", text: "¿A cuánto ascienden los gastos fijos mensuales de tu negocio (arriendo, servicios, etc.)?", prefix: "$" },
                { id: "gastos_personales", type: "number", text: "Y en lo personal, ¿cuánto suman tus gastos fijos personales o del hogar al mes?", prefix: "$" },
                { id: "deudas", type: "number", text: "¿Pagas cuotas mensuales de otras deudas? Si es así, ¿cuánto suman?", prefix: "$" },
                { id: "soportes", type: "select", text: "¿Cuentas con documentos para demostrar tus ingresos (facturas, cuadernos, extractos)?", options: ["Sí", "No"] }
            ]
        },
        {
            title: "Módulo 3: Negocio y Ahorro",
            questions: [
                { id: "antiguedad", type: "number", text: "¿Hace cuántos meses le diste vida a tu negocio?" },
                { id: "capital_inicial", type: "number", text: "¿Recuerdas con cuánto dinero empezaste tu negocio?", prefix: "$" },
                { id: "habito_ahorro", type: "select", text: "Para este programa el ahorro es clave. ¿Actualmente logras guardar algo de dinero al mes?", options: ["Sí, sagradamente", "A veces", "No, por ahora me cuesta"] },
                { id: "meta_ahorro", type: "number", text: "¿Cuánto dinero podrías ahorrar mensualmente durante los próximos 3 meses?", prefix: "$" },
                { id: "medios_pago", type: "select", text: "¿Cómo sueles recibir el dinero de tus clientes hoy en día?", 
                  options: [
                      { label: "Casi todo en efectivo", weight: 1 },
                      { label: "Mitad efectivo y mitad transferencias", weight: 2 },
                      { label: "Uso links de pago, datáfono y transferencias", weight: 3 }
                  ] 
                },
                { id: "valoracion", type: "number", text: "Si vendieras tus herramientas o mercancía hoy, ¿cuánto valdrían en total?", prefix: "$" },
                { id: "reinversion", type: "number", text: "De tus ganancias, ¿qué porcentaje reinviertes en tu negocio para hacerlo crecer?", suffix: "%" }
            ]
        },
        {
             title: "Módulo 4: Diagnóstico",
             questions: [
                 { id: "formalizacion", type: "select", text: "¿Tu negocio se encuentra registrado formalmente (Cámara de Comercio, RUT)?", 
                   options: [
                       { label: "No, opero informalmente", weight: 0 },
                       { label: "Tengo RUT pero no Cámara de Comercio", weight: 1 },
                       { label: "Sí, estoy totalmente formalizado/a", weight: 3 }
                   ]
                 },
                 { id: "destino_dinero", type: "select", text: "Cuando recibes un pago grande inesperado, ¿qué sueles hacer con ese dinero?",
                   options: [
                       { label: "Lo gasto en cosas personales que necesitaba", weight: 0 },
                       { label: "Guardo una parte y otra la gasto en mí", weight: 1 },
                       { label: "Lo reinvierto en el negocio o lo ahorro para el mismo", weight: 3 }
                   ]
                 },
                 { id: "separacion_cuentas", type: "select", text: "¿Cómo manejas el dinero de tu negocio y tu dinero personal?",
                   options: [
                       { label: "Todo está en la misma cuenta o bolsillo", weight: 0 },
                       { label: "Intento separarlos pero a veces se mezclan", weight: 1 },
                       { label: "Tengo cuentas/bolsillos totalmente separados y me pago un sueldo", weight: 3 }
                   ]
                 },
                 { id: "emergencias", type: "select", text: "Si mañana se daña una herramienta vital para tu negocio, ¿cómo la repones?",
                   options: [
                       { label: "Tendría que pedir un préstamo o parar de trabajar", weight: 0 },
                       { label: "Usaría dinero de mis gastos personales", weight: 1 },
                       { label: "Tengo un fondo de emergencias del negocio para imprevistos", weight: 3 }
                   ]
                 }
             ]
        }
    ];

    // Flatten questions for easier navigation
    const allQuestions = quizModules.flatMap(m => m.questions.map(q => ({...q, moduleTitle: m.title})));


    // --- Main App Component ---
    const App = () => {
        const [currentStep, setCurrentStep] = useState('login'); // login, welcome, quiz, loading, success
        const [documentNumber, setDocumentNumber] = useState('');
        const [loginError, setLoginError] = useState('');
        
        const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
        const [answers, setAnswers] = useState({});
        
        // For input components to hold current value before saving
        const [currentInputValue, setCurrentInputValue] = useState('');

        const handleLogin = (e) => {
            e.preventDefault();
            if (ALLOWED_USERS.includes(documentNumber)) {
                setLoginError('');
                setCurrentStep('welcome');
            } else {
                setLoginError('Documento no encontrado o no autorizado.');
            }
        };

        const startQuiz = () => {
            setCurrentStep('quiz');
            // Initialize input value if answer exists
            const q = allQuestions[0];
            setCurrentInputValue(answers[q.id]?.value || '');
        };

        const handleNext = () => {
            const currentQ = allQuestions[currentQuestionIndex];
            
            // Validation
            if (!currentInputValue && currentInputValue !== 0) {
                alert("Por favor, completa este campo para continuar.");
                return;
            }

            // Save Answer. Store both raw value and weight (if applicable)
            let weight = 0;
            if (currentQ.type === 'select' && typeof currentQ.options[0] === 'object') {
                const selectedOption = currentQ.options.find(opt => opt.label === currentInputValue);
                weight = selectedOption ? selectedOption.weight : 0;
            }

            setAnswers(prev => ({
                ...prev,
                [currentQ.id]: { value: currentInputValue, weight: weight }
            }));

            if (currentQuestionIndex < allQuestions.length - 1) {
                const nextIndex = currentQuestionIndex + 1;
                setCurrentQuestionIndex(nextIndex);
                // Pre-fill next input if answered previously
                const nextQ = allQuestions[nextIndex];
                setCurrentInputValue(answers[nextQ.id]?.value || '');
            } else {
                submitData();
            }
        };

        const handlePrev = () => {
            if (currentQuestionIndex > 0) {
                const prevIndex = currentQuestionIndex - 1;
                setCurrentQuestionIndex(prevIndex);
                // Pre-fill prev input
                const prevQ = allQuestions[prevIndex];
                setCurrentInputValue(answers[prevQ.id]?.value || '');
            }
        };

        const submitData = async () => {
            setCurrentStep('loading');
            
            // Calculate final score based ONLY on current answers state
            let totalScore = 0;
            const dataToSubmit = { Documento: documentNumber };
            
            for (const key in answers) {
                dataToSubmit[key] = answers[key].value;
                totalScore += (answers[key].weight || 0);
            }
            
            // Determine Level based on score (max 21 based on provided weights: 3+3+3+3+3+3+3)
            let nivel = "Nivel 1 (Semilla)";
            if (totalScore >= 14) nivel = "Nivel 3 (Expansión)";
            else if (totalScore >= 7) nivel = "Nivel 2 (Crecimiento)";

            dataToSubmit['Puntaje_Total'] = totalScore;
            dataToSubmit['Nivel_Asignado'] = nivel;
            dataToSubmit['Fecha'] = new Date().toISOString();

            try {
                // Simulate network request if URL is default
                if (SHEETDB_URL.includes('TU_CODIGO_AQUI')) {
                    console.log("Mock Submit Data:", dataToSubmit);
                    setTimeout(() => setCurrentStep('success'), 2000);
                    return;
                }

                const response = await fetch(SHEETDB_URL, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: [dataToSubmit] })
                });

                if (response.ok) {
                    setCurrentStep('success');
                } else {
                    console.error("Error submitting data", await response.text());
                    alert("Hubo un error guardando tus respuestas. Por favor, intenta de nuevo.");
                    setCurrentStep('quiz'); // Go back to quiz to retry
                }
            } catch (error) {
                console.error("Network error:", error);
                alert("Error de red. Verifica tu conexión.");
                setCurrentStep('quiz');
            }
        };

        // --- Render Views ---

        const renderLogin = () => (
            <div className="flex flex-col h-full fade-in bg-white sm:h-[600px] w-full">
                <div className="bg-gradient-vibrant p-8 text-white rounded-b-[40px] shadow-lg relative">
                    <h1 className="text-3xl font-bold mb-2">Bienvenid@</h1>
                    <p className="opacity-90">Programa de Emprendimiento Diverso</p>
                </div>
                
                <div className="flex-1 p-8 flex flex-col justify-center">
                    <form onSubmit={handleLogin} className="space-y-6">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">Documento de Identidad</label>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <IconUser />
                                </div>
                                <input 
                                    type="text" 
                                    value={documentNumber}
                                    onChange={(e) => setDocumentNumber(e.target.value)}
                                    className="pl-10 block w-full border-gray-300 rounded-xl shadow-sm py-3 px-4 focus:ring-purple-500 focus:border-purple-500 border bg-gray-50"
                                    placeholder="Ingresa tu cédula"
                                    required
                                />
                            </div>
                            {loginError && <p className="text-red-500 text-sm mt-2">{loginError}</p>}
                        </div>
                        
                        <button type="submit" className="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-gradient-vibrant hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition-all">
                            Ingresar
                        </button>
                    </form>
                </div>
            </div>
        );

        const renderWelcome = () => (
             <div className="flex flex-col h-full fade-in bg-white sm:h-[600px] w-full items-center justify-center p-8 text-center">
                <div className="w-24 h-24 bg-gradient-pride rounded-full flex items-center justify-center shadow-lg mb-6">
                    <IconHeartHandshake />
                </div>
                <h2 className="text-2xl font-bold text-gray-800 mb-4">¡Qué alegría tenerte aquí!</h2>
                <p className="text-gray-600 mb-8 leading-relaxed">
                    Estamos creando un espacio seguro, diverso y lleno de oportunidades para potenciar tu negocio. 
                    <br/><br/>
                    A continuación, te haremos unas preguntas para conocerte mejor a ti y a tu emprendimiento. No hay respuestas correctas o incorrectas, ¡solo sé tú mism@!
                </p>
                <button onClick={startQuiz} className="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 focus:outline-none transition-all items-center">
                    Comenzar <IconChevronRight className="ml-2" />
                </button>
            </div>
        );

        const renderQuiz = () => {
            const q = allQuestions[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / allQuestions.length) * 100;

            return (
                <div className="flex flex-col h-full fade-in bg-white sm:h-[600px] w-full">
                    {/* Header / Progress */}
                    <div className="p-6 border-b border-gray-100">
                        <div className="flex justify-between items-center mb-2">
                            <span className="text-xs font-semibold text-purple-600 uppercase tracking-wider">{q.moduleTitle}</span>
                            <span className="text-xs text-gray-500">{currentQuestionIndex + 1} de {allQuestions.length}</span>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-2 mt-2">
                            <div className="bg-gradient-vibrant h-2 rounded-full transition-all duration-300 ease-out" style={{ width: `${progress}%` }}></div>
                        </div>
                    </div>

                    {/* Question Content */}
                    <div className="flex-1 p-6 flex flex-col justify-center overflow-y-auto">
                        <h3 className="text-xl font-medium text-gray-800 mb-8 leading-snug">{q.text}</h3>

                        {q.type === 'text' && (
                            <input 
                                type="text"
                                value={currentInputValue}
                                onChange={(e) => setCurrentInputValue(e.target.value)}
                                className="block w-full border-gray-300 rounded-xl shadow-sm py-4 px-4 focus:ring-purple-500 focus:border-purple-500 border bg-gray-50 text-lg"
                                placeholder="Escribe tu respuesta aquí..."
                            />
                        )}

                        {q.type === 'number' && (
                            <div className="relative">
                                {q.prefix && <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500 font-medium">{q.prefix}</div>}
                                <input 
                                    type="number"
                                    value={currentInputValue}
                                    onChange={(e) => setCurrentInputValue(e.target.value)}
                                    className={`block w-full border-gray-300 rounded-xl shadow-sm py-4 focus:ring-purple-500 focus:border-purple-500 border bg-gray-50 text-lg ${q.prefix ? 'pl-8' : 'px-4'} ${q.suffix ? 'pr-8' : ''}`}
                                    placeholder="0"
                                />
                                {q.suffix && <div className="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-gray-500 font-medium">{q.suffix}</div>}
                            </div>
                        )}

                        {q.type === 'select' && (
                            <div className="space-y-3">
                                {q.options.map((opt, i) => {
                                    const label = typeof opt === 'string' ? opt : opt.label;
                                    const isSelected = currentInputValue === label;
                                    return (
                                        <button 
                                            key={i}
                                            onClick={() => setCurrentInputValue(label)}
                                            className={`w-full text-left p-4 rounded-xl border transition-all ${isSelected ? 'border-purple-500 bg-purple-50 shadow-sm' : 'border-gray-200 bg-white hover:border-purple-300 hover:bg-gray-50'}`}
                                        >
                                            <span className={`text-base ${isSelected ? 'font-medium text-purple-700' : 'text-gray-700'}`}>{label}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    {/* Navigation Footer */}
                    <div className="p-6 bg-gray-50 border-t border-gray-100 flex justify-between items-center mt-auto">
                        <button 
                            onClick={handlePrev}
                            disabled={currentQuestionIndex === 0}
                            className={`flex items-center p-2 rounded-full ${currentQuestionIndex === 0 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-200'}`}
                        >
                            <IconChevronLeft /> <span className="sr-only">Anterior</span>
                        </button>
                        
                        <button 
                            onClick={handleNext}
                            className="flex items-center py-3 px-6 rounded-full shadow-md text-white font-medium bg-gray-900 hover:bg-gray-800 transition-all"
                        >
                            {currentQuestionIndex === allQuestions.length - 1 ? 'Finalizar' : 'Siguiente'} <IconChevronRight className="ml-1" />
                        </button>
                    </div>
                </div>
            );
        };

        const renderLoading = () => (
             <div className="flex flex-col h-full fade-in bg-white sm:h-[600px] w-full items-center justify-center p-8 text-center">
                <IconLoader />
                <h3 className="text-xl font-medium text-gray-800 mt-4">Guardando tus respuestas...</h3>
                <p className="text-gray-500 mt-2">Estamos calculando tu perfil emprendedor.</p>
            </div>
        );

        const renderSuccess = () => (
             <div className="flex flex-col h-full fade-in bg-white sm:h-[600px] w-full items-center justify-center p-8 text-center bg-gradient-pride">
                <div className="bg-white p-6 rounded-full shadow-xl mb-6 inline-flex items-center justify-center">
                    <IconCheckCircle />
                </div>
                <h2 className="text-3xl font-bold text-gray-900 mb-4">¡Perfil Completado!</h2>
                <p className="text-gray-800 font-medium mb-8 bg-white/50 p-4 rounded-xl backdrop-blur-sm">
                    Tus datos han sido guardados exitosamente. <br/><br/>
                    Gracias por compartir tu historia con nosotros. Pronto nos contactaremos contigo con los siguientes pasos del programa.
                </p>
                <div className="mt-8 text-sm text-gray-700">
                    <p className="font-semibold">¡Brilla con orgullo y mucho éxito en tu negocio!</p>
                </div>
            </div>
        );

        // --- Render Logic ---
        switch (currentStep) {
            case 'login': return renderLogin();
            case 'welcome': return renderWelcome();
            case 'quiz': return renderQuiz();
            case 'loading': return renderLoading();
            case 'success': return renderSuccess();
            default: return renderLogin();
        }
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>

</body>
</html>
